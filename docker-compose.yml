x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # Main did application
  did:
    build:
      context: .
      target: development
    command: ["/bin/sh", "-c", "./scripts/dev-start.sh"]
    ports:
      - "9001:9001"
    environment:
      - NODE_ENV=development
      - NODE_OPTIONS=--max-old-space-size=8192
      - PORT=9001
      - SQLITE_DB_PATH=/app/db/did.sqlite
      - SQLITE_DB_MAIN_DB_NAME=main
      - REDIS_CACHE_HOSTNAME=redis
      - REDIS_CACHE_PORT=6379
      - DEBUG=environment*,graphql*
      - LAUNCH_BROWSER=0
    volumes:
      - .:/app
      - /app/node_modules
      - ./db:/app/db
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 10g
    mem_reservation: 8g
    # Note: healthcheck intentionally omitted for faster inner-loop; production compose defines it.
    networks:
      - did-network
    restart: unless-stopped
    logging: *default-logging

  # Redis cache
  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379" # Exposed for local dev only; do not expose in production
    volumes:
      - redis_data:/data
    networks:
      - did-network
    restart: unless-stopped
    command: redis-server --appendonly yes
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:

networks:
  did-network:
    driver: bridge
